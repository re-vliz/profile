<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Vliz's Profile</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loader-modern">
    <div class="loader-logo">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
  <div id="particles-js"></div>
  <div class="container">
    <div class="card">
      <img src="assets/vlizpfp.png" alt="Foto Profil" class="profile-pic" />
      <h1 class="name">Vliz</h1>
      <p class="role">Hanya orang biasa yang tertarik sama banyak hal, tapi kagak jago-jago anjing.</p>
    
      <div class="bio">
         <p>
            <a href="https://www.facebook.com/re.vlizz" target="_blank" class="fb-link tooltip" data-tooltip="Kunjungi Facebook gw">Facebook</a>|
            <a href="https://osu.ppy.sh/u/vliz" target="_blank" class="osu-link tooltip" data-tooltip="Profil osu! gw">osu!</a>|
            <a href="https://discordlookup.com/user/259251925587853313" target="_blank" class="discord-link tooltip" data-tooltip="Cek profil Discord gw">Discord</a>

          </p>
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
  particlesJS("particles-js", {
    "particles": {
      "number": {
        "value": 50,
        "density": {
          "enable": true,
          "value_area": 800
        }
      },
      "color": {
        "value": "#00ffcc"
      },
      "shape": {
        "type": "circle"
      },
      "opacity": {
        "value": 0.5,
        "random": true
      },
      "size": {
        "value": 3,
        "random": true
      },
      "move": {
        "enable": true,
        "speed": 2,
        "direction": "none",
        "random": true,
        "straight": false,
        "out_mode": "out",
        "bounce": false
      }
    },
    "interactivity": {
      "detect_on": "canvas",
      "events": {
        "onhover": {
          "enable": true,
          "mode": "grab"
        },
        "onclick": {
          "enable": true,
          "mode": "push"
        }
      },
      "modes": {
        "grab": {
          "distance": 140,
          "line_linked": {
            "opacity": 1
          }
        },
        "push": {
          "particles_nb": 4
        }
      }
    },
    "retina_detect": true
  });
</script>
<script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("loader-modern");
    loader.classList.add("hidden");
  });
</script>
</body>
</html>
